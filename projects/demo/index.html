<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f2f0e9; color: #171713; }
    main { width: min(680px, calc(100% - 40px)); padding: 56px; border: 1px solid #cbc7ba; border-radius: 28px; background: #faf9f5; box-shadow: 0 24px 80px #4c493b1a; }
    span { color: #6559d8; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
    h1 { margin: 18px 0; font-size: clamp(42px, 9vw, 78px); letter-spacing: -.06em; line-height: .95; }
    p { color: #69675f; font-size: 18px; line-height: 1.7; }
    a { display: inline-block; margin-top: 18px; color: #171713; text-underline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <span>Atlas / Demo</span>
    <h1>It works.</h1>
    <p>这是一个独立的纯静态项目。把这个文件夹复制一份并修改内容，它就会自动出现在 Atlas 首页。</p>
    <a href="../">返回项目列表</a>
  </main>
</body>
</html>
